<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner — Check-in States</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#12140F;
  --surface:#1C1F19;
  --surface-2:#262A22;
  --line:#333829;
  --text:#F5F7F2;
  --muted:#8A9187;
  --admit:#4ADE80;
  --admit-wash:#132A1B;
  --hold:#FBBF24;
  --hold-wash:#2B2210;
  --deny:#F87171;
  --deny-wash:#2C1616;
  --brand:#2F6B1C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0B0C09;
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 60px;gap:24px;
}

/* ---------- page chrome ---------- */
.masthead{max-width:520px;width:100%;text-align:center}
.masthead h1{
  font-size:19px;font-weight:600;letter-spacing:-.01em;
}
.masthead p{
  margin-top:6px;font-size:13px;line-height:1.5;color:var(--muted);
}

/* ---------- state switcher ---------- */
.switcher{
  width:100%;max-width:960px;
  display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.switcher::-webkit-scrollbar{height:5px}
.switcher::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:500;
  padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:#12140F;border-color:var(--text)}
.chip:focus-visible{outline:2px solid var(--admit);outline-offset:2px}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.g{background:var(--admit)} .dot.a{background:var(--hold)} .dot.r{background:var(--deny)} .dot.n{background:var(--muted)}

/* ---------- layout ---------- */
.rig{
  display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;
  justify-content:center;width:100%;
}

/* ---------- phone ---------- */
.phone{
  width:352px;height:722px;flex:0 0 auto;
  background:var(--ground);border:1px solid var(--line);
  border-radius:38px;padding:10px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);
}
.screen{
  position:relative;width:100%;height:100%;
  border-radius:29px;overflow:hidden;background:var(--ground);
  display:flex;flex-direction:column;
}

/* top bar */
.top{
  position:relative;z-index:3;padding:20px 18px 14px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
}
.evt{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.gate{font-size:12px;color:var(--muted);margin-top:2px}
.net{
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 7px;
  white-space:nowrap;
}
.net.off{color:var(--hold);border-color:#5A4718;background:var(--hold-wash)}

/* offline strip */
.strip{
  display:none;position:relative;z-index:3;
  background:var(--hold-wash);border-top:1px solid #5A4718;border-bottom:1px solid #5A4718;
  color:var(--hold);font-size:12px;font-weight:500;padding:9px 18px;
}
.screen[data-net="off"] .strip{display:block}

/* camera */
.cam{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 80% at 50% 42%, #1E241B 0%, #101208 70%);
}
.cam::after{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:34px 34px;opacity:.16;
}
.recticle{position:relative;z-index:2;width:198px;height:198px}
.recticle span{position:absolute;width:38px;height:38px;border:2.5px solid var(--admit);opacity:.9}
.recticle span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.recticle span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.recticle span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.recticle span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.scanline{
  position:absolute;left:8px;right:8px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--admit),transparent);
  animation:sweep 2.6s ease-in-out infinite;
}
@keyframes sweep{0%,100%{top:10px}50%{top:186px}}
.hint{
  position:absolute;z-index:2;bottom:24px;left:0;right:0;text-align:center;
  font-size:13px;color:var(--muted);
}

/* bottom bar */
.bottom{
  position:relative;z-index:3;padding:14px 18px 22px;
  display:flex;gap:10px;border-top:1px solid var(--line);background:var(--ground);
}
.bbtn{
  flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:500;padding:14px;border-radius:12px;cursor:pointer;
}
.bbtn:hover{background:var(--surface-2)}

/* ---------- result overlay ---------- */
.result{
  position:absolute;inset:0;z-index:5;display:none;
  flex-direction:column;padding:26px 22px 22px;
}
.result.on{display:flex;animation:rise .16s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.result[data-tone="admit"]{background:var(--admit-wash)}
.result[data-tone="hold"]{background:var(--hold-wash)}
.result[data-tone="deny"]{background:var(--deny-wash)}
.result[data-tone="neutral"]{background:var(--surface)}

.bar{height:5px;border-radius:3px;margin-bottom:26px;flex:0 0 auto}
[data-tone="admit"] .bar{background:var(--admit)}
[data-tone="hold"] .bar{background:var(--hold)}
[data-tone="deny"] .bar{background:var(--deny)}
[data-tone="neutral"] .bar{background:var(--muted)}

.eyebrow{
  display:flex;align-items:center;gap:9px;
  font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
}
[data-tone="admit"] .eyebrow{color:var(--admit)}
[data-tone="hold"] .eyebrow{color:var(--hold)}
[data-tone="deny"] .eyebrow{color:var(--deny)}
[data-tone="neutral"] .eyebrow{color:var(--muted)}
.glyph{
  width:21px;height:21px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ground);
}
[data-tone="admit"] .glyph{background:var(--admit)}
[data-tone="hold"] .glyph{background:var(--hold)}
[data-tone="deny"] .glyph{background:var(--deny)}
[data-tone="neutral"] .glyph{background:var(--muted)}

.who{
  font-size:35px;font-weight:600;letter-spacing:-.035em;line-height:1.05;
  margin-top:16px;
}
.meta{font-size:14.5px;color:var(--muted);margin-top:11px;line-height:1.55}
.tag{
  display:inline-block;margin-top:18px;
  font-size:20px;font-weight:600;letter-spacing:-.01em;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  padding:9px 16px;border-radius:11px;
}
.tally{
  margin-top:18px;font-size:15px;font-weight:600;
  padding-top:16px;border-top:1px solid rgba(255,255,255,.09);
}
.tally em{font-style:normal;color:var(--muted);font-weight:500}

.acts{margin-top:auto;display:flex;gap:10px;padding-top:22px}
.act{
  flex:1;font-family:inherit;font-size:15px;font-weight:600;
  padding:16px;border-radius:13px;cursor:pointer;border:1px solid rgba(255,255,255,.14);
  background:transparent;color:var(--text);
}
.act:hover{background:rgba(255,255,255,.06)}
.act.solid{background:var(--text);color:#12140F;border-color:var(--text)}
.act.warn{background:var(--hold);color:#12140F;border-color:var(--hold)}

.auto{
  margin-top:auto;padding-top:22px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:9px;
}
.pip{width:5px;height:5px;border-radius:50%;background:var(--admit);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* count picker */
.picker{margin-top:24px}
.picker-q{font-size:14.5px;color:var(--muted);margin-bottom:12px}
.nums{display:flex;gap:9px}
.num{
  flex:1;aspect-ratio:1;border-radius:14px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.14);background:transparent;
  color:var(--text);font-family:inherit;font-size:24px;font-weight:600;
}
.num:hover{background:rgba(255,255,255,.06)}
.num[aria-pressed="true"]{background:var(--admit);color:#12140F;border-color:var(--admit)}
.num:focus-visible{outline:2px solid var(--admit);outline-offset:2px}

/* search */
.field{
  margin-top:22px;width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.13);border-radius:12px;
  padding:15px 16px;color:var(--text);font-family:inherit;font-size:16px;
}
.field::placeholder{color:var(--muted)}
.field:focus{outline:none;border-color:var(--admit)}
.rows{margin-top:8px;overflow-y:auto;flex:1}
.row{
  padding:15px 4px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.row:hover{background:rgba(255,255,255,.04)}
.row-n{font-size:16px;font-weight:500}
.row-m{font-size:12.5px;color:var(--muted);margin-top:3px}
.row-s{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.row-s.in{color:var(--admit)}

/* ---------- notes ---------- */
.notes{
  width:330px;flex:0 0 auto;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:22px;
}
.notes h2{
  font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;
}
.notes dl{display:grid;grid-template-columns:96px 1fr;gap:11px 14px;font-size:13.5px}
.notes dt{color:var(--muted)}
.notes dd{font-weight:500}
.notes .why{
  margin-top:20px;padding-top:18px;border-top:1px solid var(--line);
  font-size:13.5px;line-height:1.6;color:#C4CBBE;
}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--admit);
}

@media (max-width:820px){
  .rig{gap:22px}
  .notes{width:352px}
}
@media (max-width:400px){
  body{padding:20px 10px 44px}
  .phone{width:100%;max-width:352px;height:auto;aspect-ratio:352/722}
  .notes{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="masthead">
  <h1>Scanner — check-in states</h1>
  <p>Ahmed &amp; Aisha's Wedding · Main Gate. Tap a state to preview it.</p>
</div>

<div class="switcher" id="switcher"></div>

<div class="rig">
  <div class="phone">
    <div class="screen" id="screen" data-net="on">

      <div class="top">
        <div>
          <div class="evt">Ahmed &amp; Aisha</div>
          <div class="gate">Main Gate · Musa</div>
        </div>
        <div class="net" id="net">Synced</div>
      </div>

      <div class="strip" id="strip">Offline · 7 scans waiting to sync</div>

      <div class="cam">
        <div class="recticle">
          <span></span><span></span><span></span><span></span>
          <div class="scanline"></div>
        </div>
        <div class="hint">Point at the guest's pass</div>
      </div>

      <div class="bottom">
        <button class="bbtn" onclick="go('search')">Search by name</button>
        <button class="bbtn">Recent</button>
      </div>

      <div class="result" id="result"></div>

    </div>
  </div>

  <aside class="notes">
    <h2>Behaviour</h2>
    <dl id="notes-list"></dl>
    <p class="why" id="notes-why"></p>
  </aside>
</div>

<script>
const STATES = {
  idle: {
    label:"Scanning", dot:"n", net:"on",
    sound:"—", haptic:"—", dwell:"—", log:"—",
    why:"Resting state. The reticle sweep is the only motion on screen — everything else stays still so a result registers instantly in peripheral vision."
  },

  admit1: {
    label:"Admitted", dot:"g", net:"on", tone:"admit",
    eyebrow:"Admitted", glyph:"✓",
    who:"Chidinma Okafor", meta:"Bride's Colleagues · Party of 1",
    tag:"Table 7", auto:"Returning to camera",
    sound:"Single short tone", haptic:"One light tap", dwell:"1.5s, automatic", log:"<code>admitted</code>",
    why:"The most common scan in the event. No prompt, no confirmation, no tap — camera reopens on its own. This path must never gain a step."
  },

  picker: {
    label:"How many arrived", dot:"g", net:"on", tone:"admit",
    eyebrow:"Pass valid", glyph:"✓",
    who:"Mr &amp; Mrs Adeyemi", meta:"Groom's Family · Table 12",
    picker:[1,2,3,4], preset:4,
    acts:[{t:"Admit 4",c:"solid"}],
    sound:"Single short tone", haptic:"One light tap", dwell:"Waits for staff", log:"written on confirm",
    why:"The step the household model makes necessary. Pre-selected at the full remaining count, so the usual case is still one tap — but the usher can drop it to 3 when only three people walk up."
  },

  partial: {
    label:"Partly admitted", dot:"g", net:"on", tone:"admit",
    eyebrow:"3 of 4 admitted", glyph:"✓",
    who:"Mr &amp; Mrs Adeyemi", meta:"Groom's Family",
    tag:"Table 12", tally:"1 still to come <em>· pass stays active</em>",
    auto:"Returning to camera",
    sound:"Single short tone", haptic:"One light tap", dwell:"2.5s, automatic", log:"<code>partial</code>",
    why:"Longer dwell than a full admit because there is a number to read. The pass stays live — when the fourth person turns up later, the picker simply opens at 1."
  },

  full: {
    label:"Party full", dot:"a", net:"on", tone:"hold",
    eyebrow:"Party fully admitted", glyph:"!",
    who:"Mr &amp; Mrs Adeyemi", meta:"Groom's Family · Table 12",
    tally:"4 of 4 admitted <em>· last 5:32 PM, Side Gate</em>",
    acts:[{t:"Call manager"},{t:"Dismiss",c:"solid"}],
    sound:"Double tone, lower", haptic:"Two taps", dwell:"Waits for staff", log:"<code>allowance_exhausted</code>",
    why:"The old \"already checked in\", now meaning the allowance is spent. Naming the gate and time is what resolves it — nine times in ten the party split up and someone came through elsewhere."
  },

  norsvp: {
    label:"Not confirmed", dot:"a", net:"on", tone:"hold",
    eyebrow:"No RSVP on file", glyph:"?",
    who:"Emeka Balogun", meta:"Groom's Colleagues · Party of 2",
    tally:"This event requires RSVP before entry",
    acts:[{t:"Admit anyway",c:"warn"},{t:"Dismiss"}],
    sound:"Double tone, lower", haptic:"Two taps", dwell:"Waits for staff", log:"<code>rsvp_blocked</code>",
    why:"Only appears when the organiser switched RSVP-gating on. \"Admit anyway\" is permissioned and off by default for scanner staff, so on most events this is a hard stop that fetches a manager."
  },

  revoked: {
    label:"Revoked", dot:"r", net:"on", tone:"deny",
    eyebrow:"Pass revoked", glyph:"✕",
    who:"Tunde Bakare", meta:"Removed from the guest list on 9 Dec",
    acts:[{t:"Call manager"},{t:"Dismiss",c:"solid"}],
    sound:"Long low tone", haptic:"Long buzz", dwell:"Waits for staff", log:"<code>revoked</code>",
    why:"Says why it was revoked, because the guest will ask and the usher needs an answer that isn't a shrug."
  },

  wrongevent: {
    label:"Wrong event", dot:"r", net:"on", tone:"deny",
    eyebrow:"Pass is for another event", glyph:"✕",
    who:"Yusuf &amp; Maryam", meta:"That wedding was on 5 December.<br>This pass will not open Main Gate.",
    acts:[{t:"Dismiss",c:"solid"}],
    sound:"Long low tone", haptic:"Long buzz", dwell:"Waits for staff", log:"<code>wrong_event</code>",
    why:"Only possible because each device holds the signing keys for every event its staff is assigned to. Without that, this would read as a plain forgery and nobody would learn anything."
  },

  invalid: {
    label:"Invalid", dot:"r", net:"on", tone:"deny",
    eyebrow:"Not a valid pass", glyph:"✕",
    who:"Unreadable", meta:"The code didn't verify. It may be a screenshot of something else, or damaged.",
    acts:[{t:"Search by name",c:"solid"},{t:"Dismiss"}],
    sound:"Long low tone", haptic:"Long buzz", dwell:"Waits for staff", log:"<code>invalid</code>",
    why:"Leads straight to name search rather than dead-ending, because the person is usually a real guest with a broken screen."
  },

  overflow: {
    label:"Over allowance", dot:"a", net:"on", tone:"hold",
    eyebrow:"More people than the pass allows", glyph:"!",
    who:"The Nwosu Family", meta:"Invited for 4 · 5 people at the gate",
    tally:"Admitting 5 <em>· the organiser will be notified</em>",
    acts:[{t:"Admit 5",c:"warn"},{t:"Cancel"}],
    sound:"Double tone, lower", haptic:"Two taps", dwell:"Waits for staff", log:"<code>overflow_admitted</code>",
    why:"Default is warn-and-allow, because turning away an extra cousin at a Nigerian wedding creates a scene the couple will remember. The organiser watches the overflow count rise live and can act on it."
  },

  notfound: {
    label:"Not found", dot:"r", net:"on", tone:"deny",
    eyebrow:"No matching guest", glyph:"✕",
    who:"\"Adewale\"", meta:"Nothing on the list for this event.",
    acts:[{t:"Add walk-in",c:"solid"},{t:"Dismiss"}],
    sound:"Long low tone", haptic:"Long buzz", dwell:"Waits for staff", log:"<code>not_found</code>",
    why:"A walk-in is admitted even when it pushes the event past its plan limit. The organiser gets a bill note afterwards — nobody is stopped at the door over billing."
  },

  search: {
    label:"Name search", dot:"n", net:"on", tone:"neutral",
    eyebrow:"Search guests", glyph:"⌕",
    search:true,
    sound:"—", haptic:"—", dwell:"Waits for staff", log:"<code>manual</code> on selection",
    why:"A primary path, not a fallback — dead phones are constant. Three characters minimum, name or phone. Every manual entry is flagged in the organiser's history, because it's the most abusable action in the system."
  },

  offline: {
    label:"Offline", dot:"a", net:"off", tone:"admit",
    eyebrow:"Admitted · queued", glyph:"✓",
    who:"Chidinma Okafor", meta:"Bride's Colleagues · Party of 1",
    tag:"Table 7", tally:"Saved on this phone <em>· syncs when signal returns</em>",
    auto:"Returning to camera",
    sound:"Single short tone", haptic:"One light tap", dwell:"1.5s, automatic", log:"<code>admitted</code>, unsynced",
    why:"Check-in never stops. The token verifies on the device, the row queues locally, and the header carries a persistent strip rather than a toast that vanishes before anyone reads it."
  }
};

const screen = document.getElementById('screen');
const result = document.getElementById('result');
const net = document.getElementById('net');
const switcher = document.getElementById('switcher');
const nList = document.getElementById('notes-list');
const nWhy = document.getElementById('notes-why');

Object.entries(STATES).forEach(([k,s])=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.k=k; b.type='button';
  b.setAttribute('aria-pressed', k==='idle');
  b.innerHTML=`<span class="dot ${s.dot}"></span>${s.label}`;
  b.onclick=()=>go(k);
  switcher.appendChild(b);
});

function go(k){
  const s=STATES[k];
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.k===k));

  screen.dataset.net=s.net;
  net.textContent = s.net==='off' ? 'Offline' : 'Synced';
  net.classList.toggle('off', s.net==='off');

  nList.innerHTML=`
    <dt>Sound</dt><dd>${s.sound}</dd>
    <dt>Haptic</dt><dd>${s.haptic}</dd>
    <dt>On screen</dt><dd>${s.dwell}</dd>
    <dt>Log row</dt><dd>${s.log}</dd>`;
  nWhy.innerHTML=s.why;

  if(!s.tone){ result.className='result'; result.innerHTML=''; return; }

  let h=`<div class="bar"></div>
    <div class="eyebrow"><span class="glyph">${s.glyph}</span>${s.eyebrow}</div>`;

  if(s.search){
    h+=`<input class="field" placeholder="Name or phone number" autocomplete="off">
      <div class="rows">
        ${[
          ['Adaeze Nwosu','Bride\'s Family · Party of 3','3 in','in'],
          ['Adebayo Salami','Groom\'s Colleagues · Party of 1','',''],
          ['Adaobi Eze','Bride\'s Family · Party of 2','',''],
          ['Aminu Dangote','VIP · Party of 4','4 in','in']
        ].map(([n,m,st,c])=>`<div class="row">
          <div><div class="row-n">${n}</div><div class="row-m">${m}</div></div>
          <div class="row-s ${c}">${st||'Not arrived'}</div>
        </div>`).join('')}
      </div>`;
  } else {
    if(s.who) h+=`<div class="who">${s.who}</div>`;
    if(s.meta) h+=`<div class="meta">${s.meta}</div>`;
    if(s.tag) h+=`<div><span class="tag">${s.tag}</span></div>`;
    if(s.picker){
      h+=`<div class="picker"><div class="picker-q">How many arrived?</div><div class="nums">
        ${s.picker.map(n=>`<button class="num" type="button" aria-pressed="${n===s.preset}" onclick="pick(this)">${n}</button>`).join('')}
      </div></div>`;
    }
    if(s.tally) h+=`<div class="tally">${s.tally}</div>`;
    if(s.acts) h+=`<div class="acts">${s.acts.map(a=>`<button class="act ${a.c||''}" type="button">${a.t}</button>`).join('')}</div>`;
    else if(s.auto) h+=`<div class="auto"><span class="pip"></span>${s.auto}</div>`;
  }

  result.innerHTML=h;
  result.dataset.tone=s.tone;
  result.className='result on';
}

function pick(el){
  el.parentElement.querySelectorAll('.num').forEach(n=>n.setAttribute('aria-pressed','false'));
  el.setAttribute('aria-pressed','true');
  const btn=document.querySelector('.act.solid');
  if(btn) btn.textContent='Admit '+el.textContent;
}

go('idle');
</script>
</body>
</html>
